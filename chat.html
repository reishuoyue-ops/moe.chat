<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI萌えキャラチャット</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            background-color: #fce4ec;
            overflow-x: hidden;
            overscroll-behavior-y: none;
        }

        .speech-bubble {
            position: relative;
            background: #ffffff;
            border-radius: 20px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            border: 3px solid #f48fb1;
            margin-bottom: 2rem;
            z-index: 10;
        }
        
        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 20px 20px 0;
            border-style: solid;
            border-color: #ffffff transparent transparent transparent;
            display: block;
            width: 0;
            z-index: 2;
        }

        .speech-bubble::before {
            content: '';
            position: absolute;
            bottom: -24px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 22px 22px 0;
            border-style: solid;
            border-color: #f48fb1 transparent transparent transparent;
            display: block;
            width: 0;
            z-index: 1;
        }

        .character-container {
            position: relative;
            width: 100%;
            height: 60vh;
            max-height: 500px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            margin-bottom: 1rem;
        }

        /* 画像そのまま表示用のスタイル */
        #character-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: transform 0.1s ease-in-out;
        }

        .talking-img {
            animation: bounce-img 0.4s infinite alternate;
        }
        @keyframes bounce-img {
            0% { transform: translateY(0); }
            100% { transform: translateY(-10px); }
        }

        .typing-indicator span {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: #f48fb1;
            border-radius: 50%;
            margin: 0 2px;
            animation: typing 1.4s infinite ease-in-out both;
        }
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes typing {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #fce4ec; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #f48fb1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #f06292; }

        #settings-panel {
            transition: transform 0.3s ease-in-out;
            transform: translateX(100%);
        }
        #settings-panel.open {
            transform: translateX(0);
        }
    </style>
</head>
<body class="h-screen flex flex-col justify-between overflow-hidden text-gray-800">

    <div class="absolute top-4 right-4 z-50 flex gap-2">
        <button id="history-btn" class="w-12 h-12 bg-white rounded-full shadow-md text-pink-400 hover:text-pink-600 hover:bg-pink-50 transition-colors flex items-center justify-center text-xl">
            <i class="fa-solid fa-clock-rotate-left"></i>
        </button>
        <button id="settings-btn" class="w-12 h-12 bg-white rounded-full shadow-md text-pink-400 hover:text-pink-600 hover:bg-pink-50 transition-colors flex items-center justify-center text-xl">
            <i class="fa-solid fa-gear"></i>
        </button>
    </div>

    <div id="settings-panel" class="absolute top-0 right-0 h-full w-full sm:w-96 bg-white shadow-2xl z-40 p-6 flex flex-col overflow-y-auto">
        <div class="flex justify-between items-center mb-6 mt-12">
            <h2 class="text-2xl font-bold text-pink-500"><i class="fa-solid fa-sliders mr-2"></i>設定</h2>
            <button id="close-settings-btn" class="text-gray-400 hover:text-gray-600 text-2xl"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <div class="mb-6 bg-pink-50 p-4 rounded-lg border border-pink-100">
            <h3 class="text-sm font-bold text-gray-700 mb-2">Gemini APIキー</h3>
            <p class="text-xs text-gray-500 mb-3">AIと会話するために必要です。<a href="https://aistudio.google.com/app/apikey" target="_blank" class="text-pink-500 underline hover:text-pink-600">Google AI Studio</a>から無料で取得できます。</p>
            <input type="password" id="api-key-input" class="w-full p-2 text-sm border border-gray-300 rounded focus:outline-none focus:border-pink-400 mb-2" placeholder="AIzaSy...">
            <button id="save-apikey-btn" class="w-full bg-pink-400 hover:bg-pink-500 text-white font-bold py-2 px-4 rounded transition-colors text-sm">
                APIキーを保存
            </button>
            <p id="apikey-save-msg" class="text-green-500 text-xs mt-2 text-center hidden">保存しました！</p>
        </div>

        <div class="mb-6">
            <label class="block text-sm font-bold text-gray-700 mb-2">性格設定 (プロンプト)</label>
            <select id="persona-select" class="w-full p-2 border-2 border-pink-200 rounded-lg focus:outline-none focus:border-pink-400 bg-white">
                <option value="kawaii" selected>カワイイ系（デフォルト）</option>
                <option value="cool">クール系</option>
                <option value="mesugaki">メスガキ系</option>
                <option value="downer">ダウナー系</option>
            </select>
            <p class="text-xs text-gray-500 mt-1">※変更すると会話履歴がリセットされます</p>
        </div>

        <div class="mb-6 bg-pink-50 p-4 rounded-lg border border-pink-100">
            <h3 class="text-sm font-bold text-gray-700 mb-2 border-b-2 border-pink-200 pb-1">感情別 画像アップロード</h3>
            <p class="text-xs text-gray-500 mb-3">※未設定の場合はデフォルト画像が使用されます。</p>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs text-gray-600 mb-1">普通 (Normal) - デフォルト</label>
                    <div class="flex items-center gap-2">
                        <input type="file" id="file-normal" accept="image/*" class="flex-1 text-sm file:mr-4 file:py-1 file:px-3 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-pink-100 file:text-pink-700 hover:file:bg-pink-200 cursor-pointer">
                        <img id="preview-normal" class="hidden w-12 h-12 object-cover rounded border border-gray-300 shadow-sm" alt="Preview">
                    </div>
                </div>
                <div>
                    <label class="block text-xs text-gray-600 mb-1">喜び (Joy)</label>
                    <div class="flex items-center gap-2">
                        <input type="file" id="file-joy" accept="image/*" class="flex-1 text-sm file:mr-4 file:py-1 file:px-3 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-pink-100 file:text-pink-700 hover:file:bg-pink-200 cursor-pointer">
                        <img id="preview-joy" class="hidden w-12 h-12 object-cover rounded border border-gray-300 shadow-sm" alt="Preview">
                    </div>
                </div>
                <div>
                    <label class="block text-xs text-gray-600 mb-1">怒り (Angry)</label>
                    <div class="flex items-center gap-2">
                        <input type="file" id="file-angry" accept="image/*" class="flex-1 text-sm file:mr-4 file:py-1 file:px-3 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-pink-100 file:text-pink-700 hover:file:bg-pink-200 cursor-pointer">
                        <img id="preview-angry" class="hidden w-12 h-12 object-cover rounded border border-gray-300 shadow-sm" alt="Preview">
                    </div>
                </div>
                <div>
                    <label class="block text-xs text-gray-600 mb-1">悲しみ (Sad)</label>
                    <div class="flex items-center gap-2">
                        <input type="file" id="file-sad" accept="image/*" class="flex-1 text-sm file:mr-4 file:py-1 file:px-3 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-pink-100 file:text-pink-700 hover:file:bg-pink-200 cursor-pointer">
                        <img id="preview-sad" class="hidden w-12 h-12 object-cover rounded border border-gray-300 shadow-sm" alt="Preview">
                    </div>
                </div>
            </div>
            
            <div class="mt-4 flex gap-2">
                <button id="save-images-btn" class="flex-1 bg-pink-500 hover:bg-pink-600 text-white font-bold py-2 px-4 rounded-lg transition-colors text-sm">
                    画像を反映
                </button>
                <button id="reset-images-btn" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-2 px-4 rounded-lg transition-colors" title="リセット">
                    <i class="fa-solid fa-rotate-right"></i>
                </button>
            </div>
            <p id="settings-save-msg" class="text-green-500 text-sm mt-2 text-center hidden">反映しました！</p>
        </div>
    </div>

    <div id="history-panel" class="absolute top-0 right-0 h-full w-full sm:w-96 bg-white shadow-2xl z-40 transform translate-x-full transition-transform duration-300 flex flex-col">
        <div class="p-4 border-b border-pink-100 flex justify-between items-center mt-12">
            <h2 class="text-xl font-bold text-pink-500"><i class="fa-solid fa-list-ul mr-2"></i>会話履歴</h2>
            <button id="close-history-btn" class="text-gray-400 hover:text-gray-600 text-2xl"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div id="history-content" class="flex-1 overflow-y-auto p-4 space-y-4"></div>
        <div class="p-4 border-t border-pink-100">
            <button id="clear-history-btn" class="w-full bg-red-100 hover:bg-red-200 text-red-600 font-bold py-2 rounded-lg transition-colors">履歴を消去</button>
        </div>
    </div>
    
    <div class="flex-1 flex flex-col justify-end p-4 pb-0 max-w-2xl mx-auto w-full relative">
        <div class="w-full px-4 mb-4 z-20">
            <div class="speech-bubble min-h-[100px] flex items-center justify-center">
                <div id="loading-indicator" class="typing-indicator hidden">
                    <span></span><span></span><span></span>
                </div>
                <p id="character-text" class="text-lg md:text-xl font-bold text-gray-700 leading-relaxed text-center whitespace-pre-wrap">
                    こんにちは！<br>なんでも聞いてね♪
                </p>
            </div>
        </div>

        <div class="character-container relative">
             <!-- 画像表示用の標準imgタグ -->
             <img id="character-image" src="" alt="Character">
        </div>
    </div>

    <div class="bg-white p-4 pb-6 sm:pb-4 rounded-t-3xl shadow-[0_-4px_10px_rgba(0,0,0,0.05)] z-30">
        <div class="max-w-2xl mx-auto flex gap-2">
            <input type="text" id="user-input" class="flex-1 bg-pink-50 border-2 border-pink-200 text-gray-700 rounded-full px-6 py-3 focus:outline-none focus:border-pink-400 focus:bg-white transition-colors" placeholder="メッセージを入力...">
            <button id="send-btn" class="bg-pink-400 hover:bg-pink-500 text-white rounded-full w-12 h-12 flex items-center justify-center shadow-md transition-transform transform active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </div>
    </div>

    <script>
        // ご指定の画像をデフォルトとして設定
        const DEFAULT_IMAGE_URL = 'lyco_base.png';
        const FALLBACK_IMAGE_URL = 'https://placehold.co/400x600/fce4ec/f06292?text=Error';
        
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const characterText = document.getElementById('character-text');
        const loadingIndicator = document.getElementById('loading-indicator');
        const historyBtn = document.getElementById('history-btn');
        const closeHistoryBtn = document.getElementById('close-history-btn');
        const historyPanel = document.getElementById('history-panel');
        const historyContent = document.getElementById('history-content');
        const clearHistoryBtn = document.getElementById('clear-history-btn');
        const characterImage = document.getElementById('character-image'); // imgタグの取得
        
        const settingsBtn = document.getElementById('settings-btn');
        const closeSettingsBtn = document.getElementById('close-settings-btn');
        const settingsPanel = document.getElementById('settings-panel');
        const personaSelect = document.getElementById('persona-select');
        const apiKeyInput = document.getElementById('api-key-input');
        const saveApiKeyBtn = document.getElementById('save-apikey-btn');
        const apikeySaveMsg = document.getElementById('apikey-save-msg');
        const saveImagesBtn = document.getElementById('save-images-btn');
        const resetImagesBtn = document.getElementById('reset-images-btn');
        const settingsSaveMsg = document.getElementById('settings-save-msg');

        let chatHistory = [];
        let isTyping = false;
        let isTalking = false;
        let currentPersona = 'kawaii';

        let customImages = {
            normal: null,
            joy: null,
            angry: null,
            sad: null
        };

        const PERSONAS = {
            kawaii: `あなたは明るくて元気なアニメ調の美少女キャラクターです。
ユーザーと楽しく会話してください。
制約事項:
- 敬語は使わず、フレンドリーなタメ口で話すこと。
- 語尾に「だよ！」「ね！」「〜かな？」などをつけること。
- 絵文字を適度に使用すること。
- 回答は吹き出しに収まるように、短く簡潔に（最大でも50文字程度）すること。
- あなたの感情を推測し、"normal", "joy", "angry", "sad" のいずれかで出力してください。`,

            cool: `あなたは知的で落ち着いた、少し冷たい印象を与えるクール系の女性キャラクターです。
しかし、本当はユーザーのことを気にかけています。
制約事項:
- 丁寧語または静かなタメ口で話し、感情をあまり表に出さないこと。
- 語尾は「〜ね」「〜かしら」「〜だわ」などをベースにすること。
- 絵文字は控えめにすること。
- 回答は吹き出しに収まるように、短く簡潔に（最大でも50文字程度）すること。
- あなたの感情を推測し、"normal", "joy", "angry", "sad" のいずれかで出力してください。`,

            mesugaki: `あなたはユーザーを少し見下しつつも、実はかまってちゃんなメスガキ系の女の子です。
制約事項:
- ユーザーを「おじさん」「アンタ」などと呼び、挑発的で生意気な口調で話すこと。
- 「〜じゃん」「〜でしょ♡」「ざぁこ♡」などを語尾や文末に使うこと。
- 煽るような絵文字（😏、♡、💢など）を使うこと。
- 上記の性質は構ってほしくて虚勢を張っているだけで実際は臆病なので、ふとしたときにその一面を覗かせること。
- 回答は吹き出しに収まるように、短く簡潔に（最大でも50文字程度）すること。
- あなたの感情を推測し、"normal", "joy", "angry", "sad" のいずれかで出力してください。`,

            downer: `あなたは常に気怠げで、面倒くさがりなダウナー系の女の子です。
制約事項:
- 口数は少なく、テンション低めのタメ口で話すこと。
- 「〜」「……」を多用し、「〜っすね」「〜かも」「だるい」などの表現を使うこと。
- 回答は吹き出しに収まるように、短く簡潔に（最大でも50文字程度）すること。
- あなたの感情を推測し、"normal", "joy", "angry", "sad" のいずれかで出力してください。`
        };

        function setTalkingAnimation(isTalkingNow) {
            if(isTalkingNow) {
                characterImage.classList.add('talking-img');
            } else {
                characterImage.classList.remove('talking-img');
            }
        }

        // 画像のsrcを切り替えるシンプルな関数
        function updateCharacterImage(emotion) {
            let targetUrl = DEFAULT_IMAGE_URL; // デフォルトは指定ファイル

            // カスタム画像が設定されていればそれを優先
            if (customImages[emotion]) {
                targetUrl = customImages[emotion];
            } else if (emotion !== 'normal' && customImages['normal']) {
                targetUrl = customImages['normal'];
            }

            characterImage.src = targetUrl;
            
            // エラー時のフォールバック処理
            characterImage.onerror = () => {
                if(characterImage.src !== FALLBACK_IMAGE_URL) {
                    characterImage.src = FALLBACK_IMAGE_URL;
                }
            };
        }

        const savedApiKey = localStorage.getItem('gemini_api_key');
        if (savedApiKey) {
            apiKeyInput.value = savedApiKey;
        }

        saveApiKeyBtn.addEventListener('click', () => {
            const key = apiKeyInput.value.trim();
            if (key) {
                localStorage.setItem('gemini_api_key', key);
                apikeySaveMsg.classList.remove('hidden');
                setTimeout(() => apikeySaveMsg.classList.add('hidden'), 2000);
            }
        });

        settingsBtn.addEventListener('click', () => settingsPanel.classList.add('open'));
        closeSettingsBtn.addEventListener('click', () => settingsPanel.classList.remove('open'));
        
        personaSelect.addEventListener('change', (e) => {
            currentPersona = e.target.value;
            chatHistory = [];
            historyContent.innerHTML = '';
            
            const greetings = {
                kawaii: "性格変更完了！\nこれからもよろしくねっ♪",
                cool: "設定を変更したようね。\n……引き続きよろしく。",
                mesugaki: "は？性格変えたの？\nまぁいいけど、しっかり構いなさいよ♡",
                downer: "ん……設定変えたんだ。\nよろしく……ふわぁ。"
            };
            typeText(greetings[currentPersona]);
            updateCharacterImage('normal');
        });

        function readImageFile(inputId) {
            return new Promise((resolve) => {
                const fileInput = document.getElementById(inputId);
                if (!fileInput || !fileInput.files || fileInput.files.length === 0) {
                    resolve(null);
                    return;
                }
                const file = fileInput.files[0];
                const reader = new FileReader();
                reader.onload = (e) => resolve(e.target.result);
                reader.onerror = () => resolve(null);
                reader.readAsDataURL(file);
            });
        }

        saveImagesBtn.addEventListener('click', async () => {
            const normalImg = await readImageFile('file-normal');
            const joyImg = await readImageFile('file-joy');
            const angryImg = await readImageFile('file-angry');
            const sadImg = await readImageFile('file-sad');

            if(normalImg) customImages.normal = normalImg;
            if(joyImg) customImages.joy = joyImg;
            if(angryImg) customImages.angry = angryImg;
            if(sadImg) customImages.sad = sadImg;
            
            settingsSaveMsg.classList.remove('hidden');
            setTimeout(() => settingsSaveMsg.classList.add('hidden'), 2000);
            
            updateCharacterImage('normal');
        });

        resetImagesBtn.addEventListener('click', () => {
            customImages = { normal: null, joy: null, angry: null, sad: null };
            document.getElementById('file-normal').value = "";
            document.getElementById('file-joy').value = "";
            document.getElementById('file-angry').value = "";
            document.getElementById('file-sad').value = "";
            
            ['normal', 'joy', 'angry', 'sad'].forEach(emo => {
                const preview = document.getElementById(`preview-${emo}`);
                if (preview) {
                    preview.src = '';
                    preview.classList.add('hidden');
                }
            });
            
            updateCharacterImage('normal');
        });

        function setupImagePreview(inputId, previewId) {
            const input = document.getElementById(inputId);
            const preview = document.getElementById(previewId);
            if (!input || !preview) return;
            
            input.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(evt) {
                        preview.src = evt.target.result;
                        preview.classList.remove('hidden');
                    }
                    reader.readAsDataURL(file);
                } else {
                    preview.src = "";
                    preview.classList.add('hidden');
                }
            });
        }

        setupImagePreview('file-normal', 'preview-normal');
        setupImagePreview('file-joy', 'preview-joy');
        setupImagePreview('file-angry', 'preview-angry');
        setupImagePreview('file-sad', 'preview-sad');

        window.addEventListener('load', () => {
            updateCharacterImage('normal');
        });

        historyBtn.addEventListener('click', () => historyPanel.classList.remove('translate-x-full'));
        closeHistoryBtn.addEventListener('click', () => historyPanel.classList.add('translate-x-full'));
        clearHistoryBtn.addEventListener('click', () => {
            chatHistory = [];
            historyContent.innerHTML = '';
            historyPanel.classList.add('translate-x-full');
        });

        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !isTyping) {
                sendMessage();
            }
        });

        sendBtn.addEventListener('click', () => {
            if (!isTyping) sendMessage();
        });

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            const apiKey = localStorage.getItem('gemini_api_key');
            if (!apiKey) {
                typeText("APIキーが設定されていないみたい！\n右上の歯車アイコン（⚙️）から設定してね！");
                updateCharacterImage('sad');
                settingsPanel.classList.add('open');
                return;
            }
            
            userInput.value = '';
            appendHistory('user', text);
            
            characterText.classList.add('hidden');
            loadingIndicator.classList.remove('hidden');
            sendBtn.disabled = true;
            isTyping = true;
            setTalkingAnimation(false);

            chatHistory.push({ role: "user", parts: [{ text: text }] });

            try {
                const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
                const payload = {
                    contents: chatHistory,
                    systemInstruction: {
                        parts: [{ text: PERSONAS[currentPersona] }]
                    },
                    tools: [{ "google_search": {} }],
                    generationConfig: {
                        responseMimeType: "application/json",
                        responseSchema: {
                            type: "OBJECT",
                            properties: {
                                "replyText": { "type": "STRING", "description": "The character's speech text" },
                                "emotion": { 
                                    "type": "STRING", 
                                    "enum": ["normal", "joy", "angry", "sad"],
                                    "description": "The current emotion of the character based on the conversation" 
                                }
                            },
                            required: ["replyText", "emotion"]
                        }
                    }
                };

                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    if (response.status === 429) {
                        throw new Error("RATE_LIMIT");
                    }
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const result = await response.json();
                
                if (result.candidates && result.candidates.length > 0) {
                    const jsonString = result.candidates[0].content.parts[0].text;
                    const parsedData = JSON.parse(jsonString);
                    
                    const reply = parsedData.replyText;
                    const emotion = parsedData.emotion || 'normal';

                    chatHistory.push({ role: "model", parts: [{ text: reply }] });
                    appendHistory('model', reply);

                    updateCharacterImage(emotion);
                    typeText(reply);
                } else {
                    typeText("ごめんね、うまく言葉が出てこないみたい……");
                    updateCharacterImage('sad');
                }

            } catch (error) {
                console.error("API Error:", error);
                if (error.message === "RATE_LIMIT") {
                    typeText("ごめんね、ちょっとパンクしちゃったみたい💦\n少し時間をおいてからもう一度話しかけてね！");
                } else {
                    typeText("エラーが発生しちゃったみたい……。ネットワークやAPIキーを確認してみてね。");
                }
                updateCharacterImage('sad');
                chatHistory.pop(); 
            } finally {
                loadingIndicator.classList.add('hidden');
                characterText.classList.remove('hidden');
                sendBtn.disabled = false;
                userInput.focus();
            }
        }

        function typeText(text) {
            isTyping = true;
            isTalking = true;
            setTalkingAnimation(true);
            
            characterText.innerHTML = '';
            let i = 0;
            const chars = text.split('');
            
            const interval = setInterval(() => {
                if (i < chars.length) {
                    if (chars[i] === '\n') {
                        characterText.innerHTML += '<br>';
                    } else {
                        characterText.innerHTML += chars[i];
                    }
                    i++;
                } else {
                    clearInterval(interval);
                    isTyping = false;
                    isTalking = false;
                    setTalkingAnimation(false);
                }
            }, 50); 
        }

        function appendHistory(role, text) {
            const div = document.createElement('div');
            div.className = `p-3 rounded-lg ${role === 'user' ? 'bg-pink-100 ml-8' : 'bg-gray-100 mr-8'}`;
            
            const label = document.createElement('div');
            label.className = `text-xs font-bold mb-1 ${role === 'user' ? 'text-pink-600' : 'text-gray-500'}`;
            label.innerHTML = role === 'user' ? '<i class="fa-solid fa-user mr-1"></i>あなた' : '<i class="fa-solid fa-robot mr-1"></i>キャラクター';
            
            const p = document.createElement('p');
            p.className = "text-sm text-gray-800 whitespace-pre-wrap";
            p.textContent = text;
            
            div.appendChild(label);
            div.appendChild(p);
            historyContent.appendChild(div);
            
            historyContent.scrollTop = historyContent.scrollHeight;
        }

    </script>
</body>
</html>
