<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI萌えキャラチャット</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Kosugi Maru (for cute pixel-art style text) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Kosugi Maru', sans-serif;
            background-color: #fce4ec; /* Light pink background */
            /* Prevent horizontal scroll */
            overflow-x: hidden;
            /* Prevent pull-to-refresh on mobile */
            overscroll-behavior-y: none;
        }

        /* 吹き出しのスタイル */
        .speech-bubble {
            position: relative;
            background: #ffffff;
            border-radius: 20px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            border: 3px solid #f48fb1;
            /* キャラクターの上部に配置するための調整 */
            margin-bottom: 2rem;
            z-index: 10;
        }
        
        /* 吹き出しのしっぽ */
        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 20px 20px 0;
            border-style: solid;
            border-color: #ffffff transparent transparent transparent;
            display: block;
            width: 0;
            z-index: 2;
        }

        /* 吹き出しのしっぽ（ボーダー用） */
        .speech-bubble::before {
            content: '';
            position: absolute;
            bottom: -24px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 22px 22px 0;
            border-style: solid;
            border-color: #f48fb1 transparent transparent transparent;
            display: block;
            width: 0;
            z-index: 1;
        }

        /* キャラクターコンテナ */
        .character-container {
            position: relative;
            width: 100%;
            height: 60vh; /* Viewport height dependent */
            max-height: 500px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            margin-bottom: 1rem;
        }

        /* Custom Image Canvas Style */
        #custom-character-canvas {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: transform 0.1s ease-in-out;
            display: none; /* デフォルトは非表示 */
        }

        /* デフォルトのテキストアートキャラクター用 */
        #default-text-character {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            transition: transform 0.1s ease-in-out;
        }

        .pixel-art {
            display: inline-block;
            font-family: monospace;
            font-size: clamp(10px, 3.5vw, 18px); /* 画面サイズに合わせて縮小・拡大 */
            line-height: 1;
            letter-spacing: 0;
            white-space: pre;
            background: transparent;
            text-align: left;
        }

        /* テキストアートの色定義 */
        .k { color: #111318; } /* 黒髪・輪郭 */
        .d { color: #343941; } /* 髪の明部 */
        .s { color: #f2c7aa; } /* 肌 */
        .h { color: #d58f75; } /* 肌の影 */
        .w { color: #e9edf0; } /* 白衣 */
        .g { color: #aab0b6; } /* 白衣の影 */
        .r { color: #9e3945; } /* 瞳 */
        .m { color: #c7ccd1; } /* 銀・眼鏡 */
        .f { color: #e8e8e8; } /* 彼岸花 */
        .b { color: #191c21; } /* シャツ */

        /* 新しいテキストアート（Lycoris）用のスタイル */
        :root { --pixel-size: 1em; }
        .pixel-art-new {
            display: inline-block;
            white-space: pre;
            font-size: clamp(10px, 3.5vw, 18px); /* 画面サイズに合わせて縮小・拡大 */
            line-height: 1;
            font-family: "Noto Sans Mono CJK JP", "Noto Sans Mono", "Cascadia Mono",
                         "SFMono-Regular", Consolas, "Liberation Mono", monospace;
            font-variant-ligatures: none;
            letter-spacing: 0;
            word-spacing: 0;
            user-select: none;
            text-align: left;
        }

        .px {
            display: inline-block;
            width: var(--pixel-size);
            height: var(--pixel-size);
            line-height: var(--pixel-size);
            text-align: center;
            vertical-align: top;
            overflow: hidden;
        }

        .transparent { color: transparent; }

        .c0 { color: rgb(3, 3, 4); }
        .c1 { color: rgb(17, 15, 22); }
        .c2 { color: rgb(39, 29, 36); }
        .c3 { color: rgb(47, 45, 55); }
        .c4 { color: rgb(51, 49, 61); }
        .c5 { color: rgb(122, 104, 117); }
        .c6 { color: rgb(199, 166, 159); }
        .c7 { color: rgb(248, 231, 216); }

        /* 白背景を透過させるブレンドモード（オプション） */
        .multiply-blend {
            mix-blend-mode: multiply;
        }

        /* 話している時のアニメーション（画像用） */
        .talking-img {
            animation: bounce-img 0.4s infinite alternate;
        }
        @keyframes bounce-img {
            0% { transform: translateY(0); }
            100% { transform: translateY(-10px); }
        }

        /* ローディングアニメーション */
        .typing-indicator span {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: #f48fb1;
            border-radius: 50%;
            margin: 0 2px;
            animation: typing 1.4s infinite ease-in-out both;
        }
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes typing {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* スクロールバーのカスタマイズ */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #fce4ec; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #f48fb1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #f06292; }

        /* Settings Panel Animation */
        #settings-panel {
            transition: transform 0.3s ease-in-out;
            transform: translateX(100%);
        }
        #settings-panel.open {
            transform: translateX(0);
        }
    </style>
</head>
<body class="h-screen flex flex-col justify-between overflow-hidden text-gray-800">

    <div class="absolute top-4 right-4 z-50 flex gap-2">
        <button id="history-btn" class="w-12 h-12 bg-white rounded-full shadow-md text-pink-400 hover:text-pink-600 hover:bg-pink-50 transition-colors flex items-center justify-center text-xl">
            <i class="fa-solid fa-clock-rotate-left"></i>
        </button>
        <button id="settings-btn" class="w-12 h-12 bg-white rounded-full shadow-md text-pink-400 hover:text-pink-600 hover:bg-pink-50 transition-colors flex items-center justify-center text-xl">
            <i class="fa-solid fa-gear"></i>
        </button>
    </div>

    <div id="settings-panel" class="absolute top-0 right-0 h-full w-full sm:w-96 bg-white shadow-2xl z-40 p-6 flex flex-col overflow-y-auto">
        <div class="flex justify-between items-center mb-6 mt-12">
            <h2 class="text-2xl font-bold text-pink-500"><i class="fa-solid fa-sliders mr-2"></i>設定</h2>
            <button id="close-settings-btn" class="text-gray-400 hover:text-gray-600 text-2xl"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <!-- APIキー設定 -->
        <div class="mb-6 bg-pink-50 p-4 rounded-lg border border-pink-100">
            <h3 class="text-sm font-bold text-gray-700 mb-2">Gemini APIキー</h3>
            <p class="text-xs text-gray-500 mb-3">AIと会話するために必要です。<a href="https://aistudio.google.com/app/apikey" target="_blank" class="text-pink-500 underline hover:text-pink-600">Google AI Studio</a>から無料で取得できます。</p>
            <input type="password" id="api-key-input" class="w-full p-2 text-sm border border-gray-300 rounded focus:outline-none focus:border-pink-400 mb-2" placeholder="AIzaSy...">
            <button id="save-apikey-btn" class="w-full bg-pink-400 hover:bg-pink-500 text-white font-bold py-2 px-4 rounded transition-colors text-sm">
                APIキーを保存
            </button>
            <p id="apikey-save-msg" class="text-green-500 text-xs mt-2 text-center hidden">保存しました！</p>
        </div>

        <!-- 性格設定 -->
        <div class="mb-6">
            <label class="block text-sm font-bold text-gray-700 mb-2">性格設定 (プロンプト)</label>
            <select id="persona-select" class="w-full p-2 border-2 border-pink-200 rounded-lg focus:outline-none focus:border-pink-400 bg-white">
                <option value="kawaii" selected>カワイイ系（デフォルト）</option>
                <option value="cool">クール系</option>
                <option value="mesugaki">メスガキ系</option>
                <option value="downer">ダウナー系</option>
            </select>
            <p class="text-xs text-gray-500 mt-1">※変更すると会話履歴がリセットされます</p>
        </div>

        <!-- 画像設定 -->
        <div class="mb-6 bg-pink-50 p-4 rounded-lg border border-pink-100">
            <h3 class="text-sm font-bold text-gray-700 mb-2 border-b-2 border-pink-200 pb-1">感情別 画像アップロード</h3>
            <p class="text-xs text-gray-500 mb-3">※画像を■のテキストアートにして表示します。<br>※未設定の場合はデフォルト画像が使用されます。</p>
            
            <div class="space-y-3">
                <div>
                    <label class="block text-xs text-gray-600 mb-1">普通 (Normal) - デフォルト</label>
                    <input type="file" id="file-normal" accept="image/*" class="w-full text-sm file:mr-4 file:py-1 file:px-3 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-pink-100 file:text-pink-700 hover:file:bg-pink-200 cursor-pointer">
                </div>
                <div>
                    <label class="block text-xs text-gray-600 mb-1">喜び (Joy)</label>
                    <input type="file" id="file-joy" accept="image/*" class="w-full text-sm file:mr-4 file:py-1 file:px-3 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-pink-100 file:text-pink-700 hover:file:bg-pink-200 cursor-pointer">
                </div>
                <div>
                    <label class="block text-xs text-gray-600 mb-1">怒り (Angry)</label>
                    <input type="file" id="file-angry" accept="image/*" class="w-full text-sm file:mr-4 file:py-1 file:px-3 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-pink-100 file:text-pink-700 hover:file:bg-pink-200 cursor-pointer">
                </div>
                <div>
                    <label class="block text-xs text-gray-600 mb-1">悲しみ (Sad)</label>
                    <input type="file" id="file-sad" accept="image/*" class="w-full text-sm file:mr-4 file:py-1 file:px-3 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-pink-100 file:text-pink-700 hover:file:bg-pink-200 cursor-pointer">
                </div>
            </div>
            
            <div class="mt-4 flex gap-2">
                <button id="save-images-btn" class="flex-1 bg-pink-500 hover:bg-pink-600 text-white font-bold py-2 px-4 rounded-lg transition-colors text-sm">
                    画像を反映
                </button>
                <button id="reset-images-btn" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-2 px-4 rounded-lg transition-colors" title="リセット">
                    <i class="fa-solid fa-rotate-right"></i>
                </button>
            </div>
            <p id="settings-save-msg" class="text-green-500 text-sm mt-2 text-center hidden">反映しました！</p>
        </div>
    </div>

    <div id="history-panel" class="absolute top-0 right-0 h-full w-full sm:w-96 bg-white shadow-2xl z-40 transform translate-x-full transition-transform duration-300 flex flex-col">
        <div class="p-4 border-b border-pink-100 flex justify-between items-center mt-12">
            <h2 class="text-xl font-bold text-pink-500"><i class="fa-solid fa-list-ul mr-2"></i>会話履歴</h2>
            <button id="close-history-btn" class="text-gray-400 hover:text-gray-600 text-2xl"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div id="history-content" class="flex-1 overflow-y-auto p-4 space-y-4">
            <!-- 履歴がここに追加されます -->
        </div>
        <div class="p-4 border-t border-pink-100">
            <button id="clear-history-btn" class="w-full bg-red-100 hover:bg-red-200 text-red-600 font-bold py-2 rounded-lg transition-colors">履歴を消去</button>
        </div>
    </div>
    
    <div class="flex-1 flex flex-col justify-end p-4 pb-0 max-w-2xl mx-auto w-full relative">
        
        <!-- 吹き出しエリア -->
        <div class="w-full px-4 mb-4 z-20">
            <div class="speech-bubble min-h-[100px] flex items-center justify-center">
                <div id="loading-indicator" class="typing-indicator hidden">
                    <span></span><span></span><span></span>
                </div>
                <p id="character-text" class="text-lg md:text-xl font-bold text-gray-700 leading-relaxed text-center whitespace-pre-wrap">
                    こんにちは！<br>なんでも聞いてね♪
                </p>
            </div>
        </div>

        <!-- キャラクター表示エリア -->
        <div class="character-container relative">
             <!-- Default HTML Text Art Character -->
             <div id="default-text-character" class="multiply-blend"></div>
             <!-- Canvas for Pixel Art rendering (User custom images) -->
             <canvas id="custom-character-canvas" class="multiply-blend"></canvas>
        </div>
    </div>

    <div class="bg-white p-4 pb-6 sm:pb-4 rounded-t-3xl shadow-[0_-4px_10px_rgba(0,0,0,0.05)] z-30">
        <div class="max-w-2xl mx-auto flex gap-2">
            <input type="text" id="user-input" class="flex-1 bg-pink-50 border-2 border-pink-200 text-gray-700 rounded-full px-6 py-3 focus:outline-none focus:border-pink-400 focus:bg-white transition-colors" placeholder="メッセージを入力...">
            <button id="send-btn" class="bg-pink-400 hover:bg-pink-500 text-white rounded-full w-12 h-12 flex items-center justify-center shadow-md transition-transform transform active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </div>
    </div>

        function updateCharacterImage(emotion) {
            let customUrl = null;

            if (customImages[emotion]) {
                customUrl = customImages[emotion];
            } else if (emotion !== 'normal' && customImages['normal']) {
                customUrl = customImages['normal'];
            }

            const defaultChar = document.getElementById('default-text-character');

            if (customUrl) {
                // カスタム画像が設定されている場合はCanvasで表示
                defaultChar.style.display = 'none';
                customCharacterCanvas.style.display = 'block';
                drawPixelatedImage(customUrl, false);
            } else {
                // デフォルトはユーザー指定のHTMLテキストアートを表示
                customCharacterCanvas.style.display = 'none';
                defaultChar.style.display = 'flex';
                defaultChar.innerHTML = DEFAULT_TEXT_ART;
                setTalkingAnimation(isTalking);
            }
        }

        window.addEventListener('load', () => {
            updateCharacterImage('normal');
        });

        historyBtn.addEventListener('click', () => historyPanel.classList.remove('translate-x-full'));
        closeHistoryBtn.addEventListener('click', () => historyPanel.classList.add('translate-x-full'));
        clearHistoryBtn.addEventListener('click', () => {
            chatHistory = [];
            historyContent.innerHTML = '';
            historyPanel.classList.add('translate-x-full');
        });

        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !isTyping) {
                sendMessage();
            }
        });

        sendBtn.addEventListener('click', () => {
            if (!isTyping) sendMessage();
        });

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            const apiKey = localStorage.getItem('gemini_api_key');
            if (!apiKey) {
                typeText("APIキーが設定されていないみたい！\n右上の歯車アイコン（⚙️）から設定してね！");
                updateCharacterImage('sad');
                settingsPanel.classList.add('open');
                return;
            }
            
            userInput.value = '';
            appendHistory('user', text);
            
            characterText.classList.add('hidden');
            loadingIndicator.classList.remove('hidden');
            sendBtn.disabled = true;
            isTyping = true;
            setTalkingAnimation(false);

            chatHistory.push({ role: "user", parts: [{ text: text }] });

            try {
                const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
                const payload = {
                    contents: chatHistory,
                    systemInstruction: {
                        parts: [{ text: PERSONAS[currentPersona] }]
                    },
                    tools: [{ "google_search": {} }],
                    generationConfig: {
                        responseMimeType: "application/json",
                        responseSchema: {
                            type: "OBJECT",
                            properties: {
                                "replyText": { "type": "STRING", "description": "The character's speech text" },
                                "emotion": { 
                                    "type": "STRING", 
                                    "enum": ["normal", "joy", "angry", "sad"],
                                    "description": "The current emotion of the character based on the conversation" 
                                }
                            },
                            required: ["replyText", "emotion"]
                        }
                    }
                };

                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    if (response.status === 429) {
                        throw new Error("RATE_LIMIT");
                    }
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const result = await response.json();
                
                if (result.candidates && result.candidates.length > 0) {
                    const jsonString = result.candidates[0].content.parts[0].text;
                    const parsedData = JSON.parse(jsonString);
                    
                    const reply = parsedData.replyText;
                    const emotion = parsedData.emotion || 'normal';

                    chatHistory.push({ role: "model", parts: [{ text: reply }] });
                    appendHistory('model', reply);

                    updateCharacterImage(emotion);
                    typeText(reply);
                } else {
                    typeText("ごめんね、うまく言葉が出てこないみたい……");
                    updateCharacterImage('sad');
                }

            } catch (error) {
                console.error("API Error:", error);
                if (error.message === "RATE_LIMIT") {
                    typeText("ごめんね、ちょっとパンクしちゃったみたい💦\n少し時間をおいてからもう一度話しかけてね！");
                } else {
                    typeText("エラーが発生しちゃったみたい……。ネットワークやAPIキーを確認してみてね。");
                }
                updateCharacterImage('sad');
                chatHistory.pop(); 
            } finally {
                loadingIndicator.classList.add('hidden');
                characterText.classList.remove('hidden');
                sendBtn.disabled = false;
                userInput.focus();
            }
        }

        function typeText(text) {
            isTyping = true;
            isTalking = true;
            setTalkingAnimation(true);
            
            characterText.innerHTML = '';
            let i = 0;
            const chars = text.split('');
            
            const interval = setInterval(() => {
                if (i < chars.length) {
                    if (chars[i] === '\n') {
                        characterText.innerHTML += '<br>';
                    } else {
                        characterText.innerHTML += chars[i];
                    }
                    i++;
                } else {
                    clearInterval(interval);
                    isTyping = false;
                    isTalking = false;
                    setTalkingAnimation(false);
                }
            }, 50); 
        }

        function appendHistory(role, text) {
            const div = document.createElement('div');
            div.className = `p-3 rounded-lg ${role === 'user' ? 'bg-pink-100 ml-8' : 'bg-gray-100 mr-8'}`;
            
            const label = document.createElement('div');
            label.className = `text-xs font-bold mb-1 ${role === 'user' ? 'text-pink-600' : 'text-gray-500'}`;
            label.innerHTML = role === 'user' ? '<i class="fa-solid fa-user mr-1"></i>あなた' : '<i class="fa-solid fa-robot mr-1"></i>キャラクター';
            
            const p = document.createElement('p');
            p.className = "text-sm text-gray-800 whitespace-pre-wrap";
            p.textContent = text;
            
            div.appendChild(label);
            div.appendChild(p);
            historyContent.appendChild(div);
            
            historyContent.scrollTop = historyContent.scrollHeight;
        }

    </script>
</body>
